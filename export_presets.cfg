[preset.0]

name="macOS"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter="assets/fonts/OFL.txt, CHANGELOG.md"
exclude_filter="tests/*, tickets/*, docs/*, logs/*, shots/*, builds/*"
export_path="builds/PocketParks-macos.zip"

[preset.0.options]

binary_format/architecture="universal"
application/bundle_identifier="games.pocketparks.prototype"
application/short_version="0.3.0"
application/version="0.3.0"
codesign/codesign=1
notarization/notarization=0
application/additional_plist_content="<key>NSLocalNetworkUsageDescription</key><string>Pocket Parks finds and visits your friends' parks on the same network.</string>"

[preset.1]

name="Linux"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter="assets/fonts/OFL.txt, CHANGELOG.md"
exclude_filter="tests/*, tickets/*, docs/*, logs/*, shots/*, builds/*"
